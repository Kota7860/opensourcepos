<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2c3e50">
    <title>Offline | OSPOS</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            padding: 1.5rem;
            box-sizing: border-box;
            text-align: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f5f7;
            color: #2c3e50;
        }

        img {
            width: 96px;
            height: 96px;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        p {
            margin: 0;
            max-width: 24rem;
            line-height: 1.5;
            opacity: 0.85;
        }

        button {
            border: 0;
            border-radius: 0.375rem;
            padding: 0.65rem 1.4rem;
            font-size: 1rem;
            cursor: pointer;
            background: #2c3e50;
            color: #fff;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #1b252e;
                color: #e6e9ec;
            }
        }
    </style>
</head>

<body>
    <img src="images/pwa/icon.svg" alt="OSPOS">
    <h1>You are offline</h1>
    <p>OSPOS needs a network connection to load pages. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
</body>

</html>
